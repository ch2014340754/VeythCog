spring:
  application:
    name: vc-app
  profiles:
    active: local
  servlet:
    multipart:
      # 头像上限 2MB；留出 multipart 开销，避免被 Spring 默认 1MB 提前拦截
      max-file-size: 5MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: none      # 表结构由 docs/sql/*.sql 脚本管理，不用 Hibernate 自动建
    open-in-view: false
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
  ai:
    dashscope:
      # 阿里百炼 API Key（本地可用环境变量 DASHSCOPE_API_KEY 覆盖；未填时 ChatDemo 调用会失败并给出提示）
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: ${DASHSCOPE_MODEL}
      embedding:
        options:
          model: qwen3.7-text-embedding-flash
          dimensions: 1024
          text-type: document
llm:
  # 辅助小模型：知识库摘要/标签生成 + RAG 检索 rerank，与用户对话模型解耦
  aux-model:
    vendor: dashscope
    # 当前账号实测：qwen-turbo 返回 429（限流/未开通），qwen-plus 返回 403（无权限），
    # 仅 deepseek-v4-pro-0813 可用，故先指向它；账号开通 qwen 系列后改回 qwen-turbo 即可。
    model-code: deepseek-v4-pro-0813
    temperature: 0.1
    max-input-chars: 3000
  vendors:
    dashscope:
      # 阿里百炼 AK（与 spring.ai.dashscope.api-key 保持一致，后期统一迁 Nacos）
      api-key: ${DASHSCOPE_API_KEY}
    deepseek:
      # DeepSeek AK（你稍后填写，留空时该模型可绑定但对话会报「未配置密钥」）
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com/v1
server:
  port: 8123
  servlet:
    context-path: /api

# 对象存储（RustFS，S3 协议；兼容 MinIO）。vc-common 提供基础设施封装，桶定义见 S3Bucket 枚举。
# 密钥只走环境变量 / application-local.yml，禁止写进本文件。
# 未配置时应用仍可正常启动，首次调用上传或预签名才抛出配置异常。
storage:
  s3:
    enabled: true
    endpoint: ${RUSTFS_ENDPOINT:http://localhost:9000}
    # 预签名 URL 用的公网地址（浏览器可解析的域名），与上面的内网 endpoint 分开：
    #   容器内网 http://rustfs:9000 签出来的地址，公网浏览器解析不了（拿不到壁纸/附件）
    #   留空则沿用 endpoint，仅适合纯内网或本地开发
    public-endpoint: ${RUSTFS_PUBLIC_ENDPOINT:}
    access-key: ${RUSTFS_ACCESS_KEY:}
    secret-key: ${RUSTFS_SECRET_KEY:}
    region: ${RUSTFS_REGION:us-east-1}
    path-style-access: true
    presign-expiry: 15m
    connect-timeout: 5s
    socket-timeout: 30s

# 导航书签图标（P2）：启动时把 icon_type=auto 且尚未同步的书签图标补到 S3 public-icons。
# 幂等、后台执行、失败按 1 天冷却重试；离线演示环境可设为 false。
nav:
  icon:
    sync-on-startup: true

# JWT 配置（本地默认值；生产由环境变量覆盖）
jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789}
  expire-hours: 24

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.vc.app
# knife4j高级配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# MyBatis-Plus：知识库域数据访问（PostgreSQL + pgvector）
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.vc.knowledge.entity
  configuration:
    map-underscore-to-camel-case: true


# 知识库业务配置（切片 / 检索 / embedding）
knowledge:
  chunk:
    size: 512
    overlap: 64
  retrieve:
    top-n: 5
    # L2 距离阈值（仅作质量过滤，无命中时自动回退 topN）。
    # qwen embedding 已归一化，L2 距离范围 [0, 2]；实测不同分片间 0.5~1.3。
    # 原值 0.8 在真实数据上会过滤掉全部候选（最近邻也在 0.87 以上），故调整为 1.2。
    distance-threshold: 1.2
    # 向量召回后用小模型 rerank：候选多召回一些，再按相关性截取 topN
    rerank:
      enabled: true
      candidates: 10
      max-chunk-chars: 400
  embedding:
    # 必须与 spring.ai.dashscope.embedding.options.model 保持一致
    model-id: qwen3.7-text-embedding-flash
    dimensions: 1024
    batch-size: 10
