spring:
  application:
    name: vc-app
  profiles:
    active: prod
  jpa:
    hibernate:
      ddl-auto: none      # 表结构由 docs/sql/*.sql 脚本管理，不用 Hibernate 自动建
    open-in-view: false

server:
  port: 8123
  servlet:
    context-path: /api

# JWT 配置（本地默认值；生产由环境变量覆盖）
jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789}
  expire-hours: 24


springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.vc.app
# knife4j高级配置
knife4j:
  enable: true
  setting:
    language: zh_cn
