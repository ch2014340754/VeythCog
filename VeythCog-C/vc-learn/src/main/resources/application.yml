server:
  port: 8094

spring:
  application:
    name: vc-learn
  profiles:
    active: local
  ai:
    dashscope:
      # 阿里百炼 API Key（本地可用环境变量 DASHSCOPE_API_KEY 覆盖；未填时 ChatDemo 调用会失败并给出提示）
      api-key: sk-ws-H.PLXEDIP.ha9Q.MEQCIHoBO2MhSEr0-x0eGj6LasoZPWJCe1PelgvKUYw2wuH6AiAmgD948UcSZ-6qbVR5eckLSaTEIvChEHmi5H6fgbkjqw
      chat:
        options:
          model: deepseek-v4-pro-0813
      embedding:
        options:
          model: qwen3.7-text-embedding-flash
          dimensions: 1024
          text-type: document


# 日志配置 开启 ANSI 颜色
  output:
    ansi:
      enabled: always # 强制开启，auto是自动检测，有些环境识别失败

# ========== 系统提示词配置 ==========
vc:
  learn:
    system-prompt:
      # 是否启用系统提示词（关闭后 AI 无角色设定，按通用对话回复）
      enabled: true
      # 角色标识，仅用于日志区分
      role: tcm-doctor
      # 模板文件位置（classpath 前缀），优先级高于下面的内联 template
      template-location: classpath:prompts/tcm-doctor.md
      # 内联模板（template-location 未配置或加载失败时使用）
      # template: "你是一位{role}，请以专业的态度回答用户的问题。"
      # 模板变量替换映射，对应模板中的 {变量名}
      variables:
        years: "20"
